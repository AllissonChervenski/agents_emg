[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agents-emg"
version = "0.1.0"
description = "Agents EMG: Causal Streaming DSP & Gesture Recognition Pipeline"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.20",
    "scipy>=1.7",
]

[project.optional-dependencies]
dev = ["pytest>=7", "PyYAML>=6", "ruff", "mypy"]

[tool.setuptools.packages.find]
include = ["semg_*"]
exclude = ["specs*", "tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
include = ["tests/**/*.py", "semg_*/**/*.py"]

[tool.ruff.lint]
select = ["E4", "E9", "F"]

[tool.mypy]
python_version = "3.12"
files = ["semg_dsp"]
ignore_missing_imports = true
