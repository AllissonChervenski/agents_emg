[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sdd-orchestrator"
version = "0.1.0"
description = "Deterministic SDD orchestration for external coding agents"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "PyYAML>=6", "ruff", "mypy"]

[tool.setuptools.package-data]
orchestrator = ["prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
include = ["orchestrator/**/*.py", "tests/**/*.py"]

[tool.ruff.lint]
select = ["E4", "E9", "F"]

[tool.mypy]
python_version = "3.10"
files = ["orchestrator/traceability.py", "orchestrator/tdd_contract.py", "orchestrator/interactive.py", "orchestrator/verification/harness.py"]
ignore_missing_imports = true
