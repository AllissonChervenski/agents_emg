[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "semg_classification"
version = "0.2.0"
description = "semg_classification: Causal Streaming DSP & Gesture Recognition Pipeline with TinyML ESP32 Deployment"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.20",
    "scipy>=1.7",
    "tomli>=2.0.0,<3.0.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=7", "PyYAML>=6", "ruff", "mypy"]
baseline = [
    "scikit-learn>=1.5.0,<2.0.0",
    "jsonschema>=4.19.0,<5.0.0",
]

[tool.setuptools.packages.find]
include = ["semg_*"]
exclude = ["specs*", "tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
include = ["tests/**/*.py", "semg_*/**/*.py"]

[tool.ruff.lint]
select = ["E4", "E9", "F"]

[tool.mypy]
python_version = "3.10"
files = [
    "semg_dsp",
    "semg_dataset",
    "semg_baseline",
]
ignore_missing_imports = true
no_site_packages = true
